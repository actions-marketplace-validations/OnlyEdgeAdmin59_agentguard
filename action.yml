name: "AgentGuard MCP and Skill Scanner"
description: "Detecta tool poisoning y rug pulls en skills (SKILL.md) y herramientas MCP"
author: "Vanguard Growth LLC"
branding:
  icon: "shield"
  color: "green"

inputs:
  path:
    description: "Carpeta a revisar"
    default: "."
  verify:
    description: "Comparar contra agentguard.lock.json si existe (true/false)"
    default: "true"
  lang:
    description: "Idioma de la salida: es o en"
    default: "es"
  deep:
    description: "Juicio semántico con un modelo de IA (true/false). Envía el contenido revisado a Anthropic; necesita ANTHROPIC_API_KEY en el env del paso"
    default: "false"
  deep-fail-on:
    description: "Con deep: 'high' hace fallar el job si el juez marca ALTO. Vacío = solo avisa"
    default: ""

runs:
  using: "composite"
  steps:
    # Sin acciones de terceros: usa el python3 del runner (menos superficie de ataque).
    - name: agentguard scan
      shell: bash
      env:
        AG_PATH: ${{ inputs.path }}
        AG_VERIFY: ${{ inputs.verify }}
        AGENTGUARD_LANG: ${{ inputs.lang }}
        AG_DEEP: ${{ inputs.deep }}
        AG_DEEP_FAIL: ${{ inputs.deep-fail-on }}
      run: |
        set +e
        deep_args=()
        if [ "$AG_DEEP" = "true" ]; then
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            # p. ej. PRs desde forks: no hay secretos. Se salta --deep sin fallar.
            echo "::notice title=agentguard::deep omitido: no hay ANTHROPIC_API_KEY"
          else
            python3 -m pip install --quiet --disable-pip-version-check "anthropic>=0.116"
            deep_args=(--deep --deep-yes)
            if [ -n "$AG_DEEP_FAIL" ]; then deep_args+=(--deep-fail-on "$AG_DEEP_FAIL"); fi
          fi
        fi
        python3 "$GITHUB_ACTION_PATH/agentguard.py" scan "$AG_PATH" "${deep_args[@]}" | tee /tmp/ag_scan.txt
        scan=${PIPESTATUS[0]}
        verify=0
        if [ "$AG_VERIFY" = "true" ] && [ -f "$AG_PATH/agentguard.lock.json" ]; then
          python3 "$GITHUB_ACTION_PATH/agentguard.py" verify "$AG_PATH" | tee /tmp/ag_verify.txt
          verify=${PIPESTATUS[0]}
        fi
        {
          echo "## 🛡️ agentguard"
          echo '```'; grep -hv "^::" /tmp/ag_scan.txt /tmp/ag_verify.txt 2>/dev/null; echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
        if [ "$scan" = "1" ] || [ "$verify" = "1" ]; then exit 1; fi
